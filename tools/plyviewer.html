<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLY Point Cloud Viewer</title>
    <!--
    This is a single-file HTML, CSS, and JavaScript application that uses Three.js
    to render a 3D point cloud from a PLY file. The user can drag and drop a .ply
    file onto the page to load it. The camera controls allow for rotation, panning,
    and zooming.
    -->
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', sans-serif;
            color: #fff;
            user-select: none;
            cursor: grab;
        }
        body.grabbing {
            cursor: grabbing;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #controls label {
            white-space: nowrap;
        }
        #controls input[type="range"] {
            width: 200px;
            -webkit-appearance: none;
            background: transparent;
        }
        #controls input[type="range"]::-webkit-slider-runnable-track {
            background: rgba(255, 255, 255, 0.2);
            height: 4px;
            border-radius: 2px;
        }
        #controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -6px;
        }
        #drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            flex-direction: column;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-in-out;
            border: 4px dashed rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        #drop-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px 30px;
            border-radius: 8px;
            font-size: 1.2rem;
            display: none;
            text-align: center;
        }
        #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="drop-overlay">
        <h1>Drop Your .ply File Here</h1>
        <p>This viewer works best with PLY point cloud files.</p>
    </div>
    <div id="loading-message">
        Loading...
    </div>
    <div id="info">
        <p>Drag & drop a .ply file to view.</p>
        <p>Mouse left-click: Rotate</p>
        <p>Mouse right-click: Pan</p>
        <p>Mouse scroll: Zoom</p>
    </div>
    <div id="controls">
        <label for="point-size-slider">Point Size:</label>
        <input type="range" id="point-size-slider" min="0.001" max="0.1" step="0.001" value="0.01">
    </div>

    <!-- Three.js and supporting libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
    
    <script>
        // Place all the main logic inside window.onload to ensure all scripts are ready.
        window.onload = function() {
            const canvasContainer = document.getElementById('canvas-container');
            const dropOverlay = document.getElementById('drop-overlay');
            const loadingMessage = document.getElementById('loading-message');
            const pointSizeSlider = document.getElementById('point-size-slider');
            
            let scene, camera, renderer, controls, pointsMesh;
            
            // 3D Scene Initialization
            function init() {
                // Scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x000000);
                scene.add(new THREE.AxesHelper(10)); // Add axes for better orientation

                // Camera
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 5;

                // Renderer
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                canvasContainer.appendChild(renderer.domElement);

                // Controls
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true; // Adds inertia to rotation
                controls.dampingFactor = 0.05;
                controls.minDistance = 0.1;
                controls.maxDistance = 50;

                // Handle window resize
                window.addEventListener('resize', onWindowResize, false);
            }

            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                controls.update(); // Required if damping is enabled
                renderer.render(scene, camera);
            }

            // Handle window resizing
            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            // Update point size from slider
            function updatePointSize() {
                if (pointsMesh) {
                    pointsMesh.material.size = parseFloat(pointSizeSlider.value);
                }
            }
            
            // Drag and drop event handlers
            function handleDragOver(event) {
                event.preventDefault(); // IMPORTANT: Prevent default browser behavior
                event.stopPropagation();
                dropOverlay.classList.add('active');
            }

            function handleDragLeave(event) {
                event.preventDefault();
                event.stopPropagation();
                if (!dropOverlay.contains(event.relatedTarget)) {
                    dropOverlay.classList.remove('active');
                }
            }

            function handleFileDrop(event) {
                event.preventDefault(); // IMPORTANT: Prevent default browser behavior
                event.stopPropagation();
                dropOverlay.classList.remove('active');
                loadingMessage.style.display = 'block';

                const file = event.dataTransfer.files[0];

                if (file && file.name.endsWith('.ply')) {
                    const reader = new FileReader();

                    reader.onload = function(e) {
                        try {
                            const buffer = e.target.result;
                            const loader = new THREE.PLYLoader();
                            const geometry = loader.parse(buffer);

                            // If a previous mesh exists, remove it
                            if (pointsMesh) {
                                scene.remove(pointsMesh);
                                pointsMesh.geometry.dispose();
                                pointsMesh.material.dispose();
                            }
                            
                            // Get the current point size from the slider's value
                            const initialPointSize = parseFloat(pointSizeSlider.value);

                            // Create the material and points mesh
                            const material = new THREE.PointsMaterial({
                                size: initialPointSize, // Use initial point size from slider
                                vertexColors: true // Use vertex colors from the PLY file
                            });
                            pointsMesh = new THREE.Points(geometry, material);
                            scene.add(pointsMesh);

                            // Center the point cloud and adjust camera view
                            geometry.computeBoundingBox();
                            const boundingBox = geometry.boundingBox;
                            const center = new THREE.Vector3();
                            boundingBox.getCenter(center);
                            
                            pointsMesh.position.sub(center);
                            controls.target.copy(pointsMesh.position);

                            const size = new THREE.Vector3();
                            boundingBox.getSize(size);
                            const maxDim = Math.max(size.x, size.y, size.z);
                            const fov = camera.fov * (Math.PI / 180);
                            const cameraDistance = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
                            camera.position.z = cameraDistance * 1.5;

                            console.log('PLY file loaded successfully.');

                        } catch (error) {
                            console.error('Error loading PLY file:', error);
                            // Using a custom message box instead of alert()
                            const messageBox = document.createElement('div');
                            messageBox.style.cssText = `
                                position: fixed;
                                top: 50%;
                                left: 50%;
                                transform: translate(-50%, -50%);
                                background: rgba(255, 0, 0, 0.8);
                                color: white;
                                padding: 20px;
                                border-radius: 8px;
                                z-index: 1000;
                                text-align: center;
                            `;
                            messageBox.innerHTML = `
                                <p>Error loading PLY file.</p>
                                <p>It may be corrupted or in an unsupported format.</p>
                                <button onclick="this.parentNode.remove()">OK</button>
                            `;
                            document.body.appendChild(messageBox);
                        } finally {
                            loadingMessage.style.display = 'none';
                        }
                    };

                    reader.onerror = function(e) {
                        loadingMessage.style.display = 'none';
                        console.error('FileReader error:', e);
                        const messageBox = document.createElement('div');
                        messageBox.style.cssText = `
                            position: fixed;
                            top: 50%;
                            left: 50%;
                            transform: translate(-50%, -50%);
                            background: rgba(255, 0, 0, 0.8);
                            color: white;
                            padding: 20px;
                            border-radius: 8px;
                            z-index: 1000;
                            text-align: center;
                        `;
                        messageBox.innerHTML = `
                            <p>Error reading the file.</p>
                            <button onclick="this.parentNode.remove()">OK</button>
                        `;
                        document.body.appendChild(messageBox);
                    };

                    // Read the file as an ArrayBuffer
                    reader.readAsArrayBuffer(file);
                } else {
                    loadingMessage.style.display = 'none';
                    const messageBox = document.createElement('div');
                    messageBox.style.cssText = `
                        position: fixed;
                        top: 50%;
                        left: 50%;
                        transform: translate(-50%, -50%);
                        background: rgba(255, 0, 0, 0.8);
                        color: white;
                        padding: 20px;
                        border-radius: 8px;
                        z-index: 1000;
                        text-align: center;
                    `;
                    messageBox.innerHTML = `
                        <p>Please drop a valid .ply file.</p>
                        <button onclick="this.parentNode.remove()">OK</button>
                    `;
                    document.body.appendChild(messageBox);
                }
            }
            
            // Attach drag and drop and slider listeners
            document.body.addEventListener('dragover', handleDragOver, false);
            document.body.addEventListener('dragleave', handleDragLeave, false);
            document.body.addEventListener('drop', handleFileDrop, false);
            pointSizeSlider.addEventListener('input', updatePointSize);

            init();
            animate();
            console.log('All scripts loaded. Application initialized.');
        };
    </script>
</body>
</html>
